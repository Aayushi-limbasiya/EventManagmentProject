<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:pt="jakarta.faces.passthrough"
      lang="en">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Checkout — EventMS</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&amp;family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <style>
    :root{--bg:#FFFFFF;--bg2:#F8F8FC;--border:#EBEBF5;--border2:#D8D7EE;
    --indigo:#4F46E5;--indigo2:#6B63F0;--indigolt:#EEF2FF;--violet:#7C3AED;
    --green:#059669;--greenlt:#ECFDF5;--amber:#D97706;--amberlt:#FFFBEB;
    --red:#DC2626;--redlt:#FEF2F2;
    --ink:#1A1833;--ink2:#3D3A5C;--ink3:#7C799E;--ink4:#AEACCB;
    --sw:250px;--r:10px;--rl:16px;--rxl:22px;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Outfit',sans-serif;background:var(--bg2);color:var(--ink);-webkit-font-smoothing:antialiased;}
    .main{padding-left:var(--sw);display:flex;flex-direction:column;min-height:100vh;transition:padding-left .25s ease;}
    .hd{height:62px;background:var(--bg);border-bottom:1px solid var(--border);padding:0 28px;display:flex;align-items:center;position:sticky;top:0;z-index:50;}
    .hd-t{font-family:'DM Serif Display',serif;font-size:20px;color:var(--ink);}
    .hd-s{font-size:12px;color:var(--ink4);margin-top:1px;}
    .pg{padding:28px;flex:1;display:flex;justify-content:center;}
    .wrap{width:100%;max-width:520px;}

    /* order summary */
    .order{background:linear-gradient(135deg,var(--indigo),var(--violet));border-radius:var(--rxl);padding:24px 28px;margin-bottom:20px;color:white;position:relative;overflow:hidden;}
    .order::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08);}
    .order-lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.7;margin-bottom:4px;}
    .order-ev{font-family:'DM Serif Display',serif;font-size:21px;margin-bottom:14px;}
    .order-amt{font-family:'DM Serif Display',serif;font-size:36px;}
    .order-amt small{font-size:14px;opacity:.7;font-family:'Outfit',sans-serif;}

    /* card */
    .card{background:var(--bg);border:1px solid var(--border);border-radius:var(--rxl);padding:26px;}
    .sec-title{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:12px;}

    /* method selector */
    .methods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px;}
    .method{border:1.5px solid var(--border);border-radius:12px;padding:14px 10px;text-align:center;cursor:pointer;transition:.15s;background:var(--bg);}
    .method:hover{border-color:var(--border2);}
    .method.sel{border-color:var(--indigo);background:var(--indigolt);box-shadow:0 0 0 3px rgba(79,70,229,.08);}
    .method-ic{font-size:22px;margin-bottom:5px;}
    .method-nm{font-size:12px;font-weight:600;color:var(--ink2);}

    .fg{margin-bottom:16px;}
    .fl{display:block;font-size:11px;font-weight:700;color:var(--ink3);margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase;}
    .fi{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px;font-family:'Outfit',sans-serif;color:var(--ink);background:white;outline:none;transition:border-color .14s;}
    .fi:focus{border-color:var(--indigo);box-shadow:0 0 0 3px var(--indigolt);}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .hint{font-size:11px;color:var(--ink4);margin-top:5px;}

    .btn-submit{width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:700;font-family:'Outfit',sans-serif;background:linear-gradient(135deg,var(--indigo),var(--violet));color:white;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(79,70,229,.3);margin-top:6px;}
    .btn-submit:hover{opacity:.92;}
    .back{display:inline-flex;align-items:center;gap:6px;color:var(--ink3);text-decoration:none;font-size:13px;margin-bottom:14px;}
    .back:hover{color:var(--indigo);}
    .secure{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;color:var(--ink4);margin-top:14px;}
    .demo-note{background:var(--amberlt);border:1px solid #F3E3BC;border-radius:10px;padding:10px 14px;font-size:12px;color:var(--amber);margin-bottom:18px;}
    </style>
</h:head>
<h:body>

<ui:include src="user_sidebar.xhtml">
    <ui:param name="activeMenu" value="payments"/>
</ui:include>

<div class="main" id="main">
    <div class="hd">
        <div>
            <div class="hd-t">Checkout</div>
            <div class="hd-s">Secure payment · EventMS Pay</div>
        </div>
    </div>

    <div class="pg">
        <div class="wrap">

            <!-- read regId from URL and prefill -->
            <f:metadata>
                <f:viewParam name="regId" value="#{userPayBean.registrationId}"/>
                <f:event type="preRenderView" listener="#{userPayBean.initCheckout}"/>
            </f:metadata>

            <a href="user_payments.xhtml" class="back">← Back to Payments</a>

            <!-- ORDER SUMMARY -->
            <div class="order">
                <div class="order-lbl">Paying for</div>
                <div class="order-ev"><h:outputText value="#{userPayBean.eventTitle}"/></div>
                <div class="order-amt"><small>₹</small><h:outputText value="#{userPayBean.amount}"/></div>
            </div>

            <div class="demo-note">🎓 Demo gateway — no real money is charged. Card/UPI details are validated but never stored.</div>

            <h:messages globalOnly="true"
                style="display:block;margin-bottom:14px;padding:12px 16px;background:var(--redlt);border-radius:10px;font-size:13px;color:var(--red);" layout="list"/>

            <!-- PAYMENT FORM -->
            <div class="card">
                <h:form id="payForm">
                    <h:inputHidden value="#{userPayBean.registrationId}"/>

                    <div class="sec-title">Payment Method</div>
                    <div class="methods">
                        <div class="method sel" id="m-UPI"    onclick="pickMethod('UPI')">
                            <div class="method-ic">📱</div><div class="method-nm">UPI</div>
                        </div>
                        <div class="method" id="m-Card"   onclick="pickMethod('Card')">
                            <div class="method-ic">💳</div><div class="method-nm">Card</div>
                        </div>
                        <div class="method" id="m-Wallet" onclick="pickMethod('Wallet')">
                            <div class="method-ic">👛</div><div class="method-nm">Wallet</div>
                        </div>
                    </div>
                    <h:inputHidden id="pm" value="#{userPayBean.paymentMethod}"/>

                    <!-- UPI -->
                    <div id="sec-UPI">
                        <div class="fg">
                            <label class="fl">UPI ID</label>
                            <h:inputText value="#{userPayBean.upiId}" styleClass="fi" pt:placeholder="yourname@upi"/>
                            <div class="hint">e.g. vivek@oksbi, name@paytm</div>
                        </div>
                    </div>

                    <!-- CARD -->
                    <div id="sec-Card" style="display:none;">
                        <div class="fg">
                            <label class="fl">Card Number</label>
                            <h:inputText value="#{userPayBean.cardNumber}" styleClass="fi" pt:placeholder="4242 4242 4242 4242" pt:maxlength="19"/>
                        </div>
                        <div class="fg">
                            <label class="fl">Name on Card</label>
                            <h:inputText value="#{userPayBean.cardName}" styleClass="fi" pt:placeholder="VIVEK DEVGANIYA"/>
                        </div>
                        <div class="row2">
                            <div class="fg">
                                <label class="fl">Expiry</label>
                                <h:inputText value="#{userPayBean.cardExpiry}" styleClass="fi" pt:placeholder="MM/YY" pt:maxlength="5"/>
                            </div>
                            <div class="fg">
                                <label class="fl">CVV</label>
                                <h:inputSecret value="#{userPayBean.cardCvv}" styleClass="fi" pt:placeholder="•••" pt:maxlength="4" redisplay="true"/>
                            </div>
                        </div>
                    </div>

                    <!-- WALLET -->
                    <div id="sec-Wallet" style="display:none;">
                        <div class="fg">
                            <label class="fl">Wallet</label>
                            <h:selectOneMenu styleClass="fi" value="#{userPayBean.upiId}">
                                <f:selectItem itemLabel="EventMS Wallet (Balance ₹9,999)" itemValue="wallet@eventms"/>
                                <f:selectItem itemLabel="Paytm Wallet" itemValue="wallet@paytm"/>
                                <f:selectItem itemLabel="PhonePe Wallet" itemValue="wallet@phonepe"/>
                            </h:selectOneMenu>
                        </div>
                    </div>

                    <h:commandButton value="Pay ₹#{userPayBean.amount} Securely →"
                                     styleClass="btn-submit"
                                     action="#{userPayBean.submitPayment}"/>

                    <div class="secure">🔒 256-bit simulated encryption · EventMS Pay</div>
                </h:form>
            </div>

        </div>
    </div>
</div>

<script>//<![CDATA[
function pickMethod(m){
    ['UPI','Card','Wallet'].forEach(function(x){
        document.getElementById('m-'+x).classList.toggle('sel', x===m);
        document.getElementById('sec-'+x).style.display = (x===m)?'':'none';
    });
    // write into the hidden JSF input (id ends with :pm or is pm with prependId)
    var hid = document.querySelector('[id$="pm"]');
    if(hid) hid.value = m;
}
//]]></script>
</h:body>
</html>
