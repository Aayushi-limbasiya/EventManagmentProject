<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets">
<!--
  ===========================================================
   SHARED USER SIDEBAR  (user_sidebar.xhtml)
   Include in any page:  <ui:include src="user_sidebar.xhtml">
                            <ui:param name="activeMenu" value="dashboard"/>
                          </ui:include>
   Edit ONLY this file to change the sidebar everywhere.
   activeMenu values: dashboard | browse | registrations |
                      payments | certificates | feedback | profile
  ===========================================================
-->
<style>
    .usb-toggle{position:fixed;top:14px;left:14px;z-index:200;width:34px;height:34px;border-radius:10px;background:#4F46E5;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:all .15s;box-shadow:0 2px 8px rgba(79,70,229,.35);}
    .usb-toggle:hover{background:#6B63F0;}
    .usb-toggle span{display:block;width:16px;height:1.5px;background:rgba(255,255,255,.9);border-radius:2px;transition:all .2s;}
    .usb-toggle.open span:nth-child(1){transform:translateY(5.5px) rotate(45deg);}
    .usb-toggle.open span:nth-child(2){opacity:0;}
    .usb-toggle.open span:nth-child(3){transform:translateY(-5.5px) rotate(-45deg);}
    .usb{position:fixed;top:0;left:0;bottom:0;width:250px;background:#FFFFFF;border-right:1px solid #EBEBF5;display:flex;flex-direction:column;z-index:100;overflow-y:auto;overflow-x:hidden;transition:width .25s ease,transform .25s ease;}
    .usb.collapsed{width:0;transform:translateX(-100%);}
    .usb::-webkit-scrollbar{width:0;}
    .usb-glow{height:3px;background:linear-gradient(90deg,#4F46E5,#7C3AED,#DB2777);}
    .usb-logo{display:flex;align-items:center;gap:10px;padding:18px 18px 16px 54px;border-bottom:1px solid #EBEBF5;text-decoration:none;white-space:nowrap;}
    .usb-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#4F46E5,#7C3AED);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .usb-mark svg{width:17px;height:17px;fill:#fff;}
    .usb-word{font-family:'DM Serif Display',serif;font-size:18px;color:#1A1833;}
    .usb-user{margin:14px 12px 6px;padding:12px 14px;background:#EEF2FF;border:1px solid #D8D7EE;border-radius:16px;display:flex;align-items:center;gap:10px;white-space:nowrap;text-decoration:none;}
    .usb-user:hover{background:#E0E7FF;}
    .usb-av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#4F46E5,#7C3AED);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;}
    .usb-uname{font-size:13px;font-weight:600;color:#1A1833;}
    .usb-urole{font-size:10px;color:#7C799E;margin-top:1px;}
    .usb-dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:#059669;box-shadow:0 0 0 2px #ECFDF5;}
    .usb-sec{padding:14px 18px 5px;font-size:9px;font-weight:700;color:#AEACCB;text-transform:uppercase;letter-spacing:.14em;white-space:nowrap;}
    .usb-a{display:flex;align-items:center;gap:10px;padding:9px 16px;margin:1px 8px;border-radius:10px;font-size:13px;font-weight:500;color:#7C799E;text-decoration:none;cursor:pointer;transition:all .15s;white-space:nowrap;}
    .usb-a:hover{background:#F8F8FC;color:#3D3A5C;}
    .usb-a.on{background:#EEF2FF;color:#4F46E5;font-weight:600;}
    .usb-a svg{width:15px;height:15px;flex-shrink:0;}
    .usb-new{margin-left:auto;font-size:9px;font-weight:700;background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff;padding:2px 7px;border-radius:20px;}
    .usb-hr{height:1px;background:#EBEBF5;margin:8px 12px;}
    .usb-foot{margin-top:auto;padding:10px 8px;border-top:1px solid #EBEBF5;}
    .usb-fa{display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:500;color:#7C799E;text-decoration:none;cursor:pointer;transition:all .15s;white-space:nowrap;background:none;border:none;width:100%;font-family:'Outfit',sans-serif;}
    .usb-fa:hover{background:#F8F8FC;color:#3D3A5C;}
    .usb-fa.on{background:#EEF2FF;color:#4F46E5;font-weight:600;}
    .usb-fa.danger:hover{background:#FEF2F2;color:#DC2626;}
    .usb-fa svg{width:15px;height:15px;}
    /* page content shifts right to make room for sidebar */
    body.has-usb .main,body.has-usb #main,body.has-usb #mainContent{transition:padding-left .25s ease;}
</style>

<button class="usb-toggle open" id="usbToggle" onclick="usbToggle()" title="Toggle sidebar">
    <span></span><span></span><span></span>
</button>

<div class="usb" id="usb">
    <div class="usb-glow"></div>

    <a href="user_dashboard.xhtml" class="usb-logo">
        <div class="usb-mark"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/></svg></div>
        <span class="usb-word">EventMS</span>
    </a>

    <a href="user_profile.xhtml" class="usb-user">
        <div class="usb-av"><h:outputText value="#{authBean.loggedInUser.name.substring(0,2).toUpperCase()}"/></div>
        <div>
            <div class="usb-uname"><h:outputText value="#{authBean.loggedInUser.name}"/></div>
            <div class="usb-urole">Participant</div>
        </div>
        <div class="usb-dot"></div>
    </a>

    <div class="usb-sec">My Space</div>
    <a href="user_dashboard.xhtml" class="usb-a #{activeMenu eq 'dashboard' ? 'on' : ''}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
    </a>
    <a href="user_browse_events.xhtml" class="usb-a #{activeMenu eq 'browse' ? 'on' : ''}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Browse Events<span class="usb-new">NEW</span>
    </a>
    <a href="user_my_registrations.xhtml" class="usb-a #{activeMenu eq 'registrations' ? 'on' : ''}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        My Registrations
    </a>

    <div class="usb-hr"></div>
    <div class="usb-sec">Manage</div>
    <a href="user_payments.xhtml" class="usb-a #{activeMenu eq 'payments' ? 'on' : ''}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>Payments
    </a>
    <a href="user_certificates.xhtml" class="usb-a #{activeMenu eq 'certificates' ? 'on' : ''}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Certificates
    </a>
    <a href="user_feedback.xhtml" class="usb-a #{activeMenu eq 'feedback' ? 'on' : ''}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>Feedback &amp; Reviews
    </a>

    <div class="usb-hr"></div>
    <div class="usb-foot">
        <a href="user_profile.xhtml" class="usb-fa #{activeMenu eq 'profile' ? 'on' : ''}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>My Profile
        </a>
        <h:form>
            <h:commandLink action="#{authBean.logout}" styleClass="usb-fa danger">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sign out
            </h:commandLink>
        </h:form>
    </div>
</div>

<script>
//<![CDATA[
(function(){
  // Mark body so we can style the content shift
  document.body.classList.add('has-usb');

  // Find this page's main content wrapper (different pages use different ids)
  function mainEl(){
    return document.getElementById('main')
        || document.getElementById('mainContent')
        || document.querySelector('.main');
  }
  // Ensure the content area leaves room for the 250px sidebar
  function applyPadding(open){
    var m = mainEl();
    if(m) m.style.paddingLeft = open ? '250px' : '0';
  }

  window.usbToggle = function(){
    var sb = document.getElementById('usb');
    var open = sb.classList.contains('collapsed'); // currently collapsed -> will open
    sb.classList.toggle('collapsed');
    document.getElementById('usbToggle').classList.toggle('open', open);
    applyPadding(open);
    localStorage.setItem('userSidebarOpen', open);
  };

  // initial state
  var saved = localStorage.getItem('userSidebarOpen');
  var startOpen = (saved !== 'false');
  var sb = document.getElementById('usb');
  if(!startOpen){
    sb.classList.add('collapsed');
    document.getElementById('usbToggle').classList.remove('open');
  }
  applyPadding(startOpen);
})();
//]]>
</script>
</ui:composition>
