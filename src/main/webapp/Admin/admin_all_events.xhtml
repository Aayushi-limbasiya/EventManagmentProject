<!DOCTYPE html>
<html xmlns:ui="jakarta.faces.facelets"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      lang="en">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>All Events — EventMS Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&amp;family=Geist:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
    <style>
    :root{--stone-50:#FAFAF7;--stone-100:#F5F4EF;--stone-200:#EAE8E0;--stone-300:#D6D3C8;--stone-400:#B8B4A4;--stone-500:#8A8675;--stone-600:#605D50;--stone-700:#3D3B31;--stone-800:#1C1A14;--sage:#4A7058;--sage-light:#EBF2ED;--sage-mid:#C2D9CA;--amber:#8B5E1A;--amber-lt:#FAF0DC;--amber-mid:#E8C87A;--green:#3A6B4A;--green-lt:#EAF3EC;--red:#8B2E2E;--red-lt:#F5EAEA;--display:'Cormorant Garamond',Georgia,serif;--body:'Geist',system-ui,sans-serif;--sidebar-w:256px;--radius-sm:6px;--radius:10px;--radius-lg:14px;--shadow-sm:0 1px 3px rgba(15,14,10,0.06);--shadow:0 2px 8px rgba(15,14,10,0.08),0 4px 16px rgba(15,14,10,0.05);--shadow-lg:0 8px 32px rgba(15,14,10,0.10);--transition:0.25s ease;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:var(--body);background:var(--stone-100);color:var(--stone-800);-webkit-font-smoothing:antialiased;font-size:14px;}
    .shell{display:flex;min-height:100vh;}
    .main{flex:1;min-width:0;padding-left:var(--sidebar-w);display:flex;flex-direction:column;transition:padding-left var(--transition);}
    .main.expanded{padding-left:0;}
    .sidebar{position:fixed;inset-block:0;left:0;width:var(--sidebar-w);background:var(--stone-800);display:flex;flex-direction:column;z-index:100;overflow-y:auto;overflow-x:hidden;transition:width var(--transition),transform var(--transition);}
    .sidebar.collapsed{width:0;transform:translateX(-100%);}
    .sidebar::-webkit-scrollbar{width:0;}
    .sb-toggle{position:fixed;top:14px;left:14px;z-index:200;width:34px;height:34px;border-radius:var(--radius-sm);background:var(--stone-800);border:1px solid rgba(255,255,255,0.1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:all 0.15s;}
    .sb-toggle:hover{background:var(--stone-700);}
    .sb-toggle span{display:block;width:16px;height:1.5px;background:rgba(255,255,255,0.7);border-radius:2px;transition:all 0.2s;}
    .sb-toggle.open span:nth-child(1){transform:translateY(5.5px) rotate(45deg);}
    .sb-toggle.open span:nth-child(2){opacity:0;}
    .sb-toggle.open span:nth-child(3){transform:translateY(-5.5px) rotate(-45deg);}
    .sidebar-stripe{height:2px;background:linear-gradient(90deg,var(--sage) 0%,var(--amber-mid) 100%);flex-shrink:0;}
    .sb-logo{display:flex;align-items:center;gap:11px;padding:20px 18px 18px 54px;border-bottom:1px solid rgba(255,255,255,0.06);text-decoration:none;white-space:nowrap;}
    .sb-logo-mark{width:32px;height:32px;border-radius:var(--radius-sm);background:var(--sage);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .sb-logo-mark svg{width:16px;height:16px;fill:white;}
    .sb-logo-text{font-family:var(--display);font-size:19px;font-weight:600;color:var(--stone-50);}
    .sb-logo-role{margin-left:auto;font-size:9px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:var(--stone-500);border:1px solid rgba(255,255,255,0.08);padding:2px 7px;border-radius:20px;white-space:nowrap;}
    .sb-identity{margin:12px 14px 6px;padding:11px 13px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:var(--radius);display:flex;align-items:center;gap:10px;white-space:nowrap;}
    .sb-av{width:30px;height:30px;border-radius:50%;background:var(--sage);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:white;flex-shrink:0;}
    .sb-name{font-size:13px;font-weight:500;color:var(--stone-200);}
    .sb-tag{font-size:10px;color:var(--stone-500);margin-top:1px;}
    .sb-section{padding:16px 18px 5px;font-size:9px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--stone-600);white-space:nowrap;}
    .sb-link{display:flex;align-items:center;gap:9px;padding:8px 15px;margin:1px 8px;border-radius:var(--radius-sm);font-size:13px;font-weight:400;color:var(--stone-400);text-decoration:none;cursor:pointer;transition:all 0.14s;position:relative;white-space:nowrap;}
    .sb-link:hover{background:rgba(255,255,255,0.05);color:var(--stone-100);}
    .sb-link.active{background:rgba(74,112,88,0.18);color:var(--stone-50);font-weight:500;}
    .sb-link.active::before{content:'';position:absolute;left:0;top:22%;bottom:22%;width:2px;border-radius:0 2px 2px 0;background:var(--sage);}
    .sb-link svg{width:14px;height:14px;flex-shrink:0;opacity:0.6;}
    .sb-link.active svg,.sb-link:hover svg{opacity:1;}
    .sb-count{margin-left:auto;font-size:10px;font-weight:600;background:var(--amber);color:white;padding:1px 7px;border-radius:20px;}
    .sb-count.g{background:var(--green);}
    .sb-sep{height:1px;background:rgba(255,255,255,0.05);margin:8px 14px;}
    .sb-footer{margin-top:auto;border-top:1px solid rgba(255,255,255,0.05);padding:10px 8px 14px;}
    .sb-foot-link{display:flex;align-items:center;gap:9px;padding:8px 15px;border-radius:var(--radius-sm);font-size:13px;color:var(--stone-500);text-decoration:none;cursor:pointer;transition:all 0.14s;white-space:nowrap;}
    .sb-foot-link:hover{background:rgba(255,255,255,0.04);color:var(--stone-300);}
    .sb-foot-link.out:hover{background:rgba(139,46,46,0.12);color:#D47878;}
    .sb-foot-link svg{width:14px;height:14px;opacity:0.5;}
    .topbar{height:58px;background:var(--stone-50);border-bottom:1px solid var(--stone-200);padding:0 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:var(--shadow-sm);}
    .topbar-title{font-family:var(--display);font-size:20px;font-weight:600;color:var(--stone-800);}
    .topbar-sub{font-size:11px;color:var(--stone-400);margin-top:1px;}
    .content{padding:24px 28px 40px;flex:1;}
    .actions-bar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
    .search-wrap{position:relative;flex:1;max-width:320px;}
    .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--stone-400);}
    .search-input{width:100%;padding:9px 14px 9px 36px;border:1px solid var(--stone-200);border-radius:var(--radius);font-size:13px;font-family:var(--body);background:white;color:var(--stone-800);outline:none;transition:border-color 0.14s;}
    .search-input:focus{border-color:var(--sage);}
    .filter-select{padding:9px 14px;border:1px solid var(--stone-200);border-radius:var(--radius);font-size:13px;font-family:var(--body);background:white;color:var(--stone-700);outline:none;cursor:pointer;}
    .filter-select:focus{border-color:var(--sage);}
    .ev-count{font-size:13px;color:var(--stone-500);margin-left:auto;}

    /* EVENT CARDS */
    .events-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
    .ev-card{background:var(--stone-50);border:1px solid var(--stone-200);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm);transition:box-shadow 0.15s,transform 0.15s;}
    .ev-card:hover{box-shadow:var(--shadow);transform:translateY(-2px);}
    .ev-banner{height:80px;position:relative;display:flex;align-items:flex-end;padding:12px 16px;}
    .ev-banner-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.55),transparent);}
    .ev-banner-title{font-family:var(--display);font-size:17px;font-weight:600;color:white;position:relative;z-index:1;line-height:1.2;}
    .ev-body{padding:14px 16px;}
    .ev-organizer{font-size:12px;color:var(--stone-400);margin-bottom:10px;display:flex;align-items:center;gap:5px;}
    .ev-desc{font-size:12px;color:var(--stone-500);line-height:1.55;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .ev-meta-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
    .ev-meta-chip{font-size:11px;color:var(--stone-600);background:var(--stone-100);padding:3px 9px;border-radius:20px;border:1px solid var(--stone-200);display:flex;align-items:center;gap:4px;}
    .ev-footer{display:flex;align-items:center;justify-content:space-between;}

    /* STATUS TAGS */
    .tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;}
    .tag::before{content:'';width:5px;height:5px;border-radius:50%;flex-shrink:0;}
    .tag-sage{background:var(--sage-light);color:var(--sage);border:1px solid var(--sage-mid);}
    .tag-sage::before{background:var(--sage);}
    .tag-amber{background:var(--amber-lt);color:var(--amber);border:1px solid #E8C87A;}
    .tag-amber::before{background:var(--amber-mid);}
    .tag-green{background:var(--green-lt);color:var(--green);border:1px solid #A8CDB3;}
    .tag-green::before{background:#6BAE82;}
    .tag-red{background:var(--red-lt);color:var(--red);border:1px solid #D4A0A0;}
    .tag-red::before{background:#C47A7A;}
    .tag-stone{background:var(--stone-100);color:var(--stone-500);border:1px solid var(--stone-300);}
    .tag-stone::before{background:var(--stone-400);}

    .btn{padding:6px 14px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;font-family:var(--body);border:1px solid var(--stone-200);background:white;color:var(--stone-600);cursor:pointer;transition:all 0.14s;}
    .btn:hover{border-color:var(--stone-300);color:var(--stone-800);}
    .btn-sage{background:var(--sage);color:white;border-color:var(--sage);}
    .btn-sage:hover{background:#3D5E49;}
    .btn-sm{padding:5px 11px;font-size:11px;}

    /* Banner color palettes by index */
    .banner-0{background:linear-gradient(135deg,#3D5A4A,#5A8A6A);}
    .banner-1{background:linear-gradient(135deg,#4A3D5A,#7A6A8A);}
    .banner-2{background:linear-gradient(135deg,#5A4A3D,#8A7A6A);}
    .banner-3{background:linear-gradient(135deg,#3D4A5A,#6A7A8A);}
    .banner-4{background:linear-gradient(135deg,#5A3D3D,#8A6A6A);}
    .banner-5{background:linear-gradient(135deg,#3D5A5A,#6A8A8A);}

    .empty{text-align:center;padding:60px 20px;color:var(--stone-400);}
    .empty-icon{font-size:40px;margin-bottom:12px;}
    </style>
</h:head>
<h:body>

<ui:include src="admin_sidebar.xhtml">
    <ui:param name="activeMenu" value="events"/>
</ui:include>

<!-- MAIN -->
<div class="main" id="mainContent">
    <div class="topbar">
        <div><div class="topbar-title">All Events</div><div class="topbar-sub">Complete event registry</div></div>
    </div>
    <div class="content">
        <div class="actions-bar">
            <div class="search-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" class="search-input" placeholder="Search events…" oninput="filterEvents(this.value, document.getElementById('statusFilter').value)"/>
            </div>
            <select class="filter-select" id="statusFilter" onchange="filterEvents(document.querySelector('.search-input').value, this.value)">
                <option value="">All statuses</option>
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="draft">Draft</option>
                <option value="completed">Completed</option>
                <option value="rejected">Rejected</option>
            </select>
            <span class="ev-count" id="evCount"></span>
        </div>

        <!-- Event cards from JSF -->
        <div class="events-grid" id="eventsGrid">
            <h:dataTable value="#{adminEventBean.allEvents}" var="ev" id="eventsTable">
                <h:column>
                    <div class="ev-card" data-title="#{ev.title}" data-status="#{ev.status}">
                        <div class="ev-banner banner-#{ev.eventId mod 6}">
                            <div class="ev-banner-overlay"></div>
                            <div class="ev-banner-title"><h:outputText value="#{ev.title}"/></div>
                        </div>
                        <div class="ev-body">
                            <div class="ev-organizer">
                                👤 <h:outputText value="#{ev.userId.name}"/>
                            </div>
                            <div class="ev-desc">
                                <h:outputText value="#{ev.description}"/>
                            </div>
                            <div class="ev-meta-row">
                                <span class="ev-meta-chip">📋 ID: <h:outputText value="#{ev.eventId}"/></span>
                                <h:panelGroup rendered="#{not empty ev.eventScheduleCollection}">
                                    <span class="ev-meta-chip">📅 Scheduled</span>
                                </h:panelGroup>
                            </div>
                            <div class="ev-footer">
                                <h:panelGroup>
                                    <h:panelGroup rendered="#{ev.status == 'Approved'}"><span class="tag tag-sage">Approved</span></h:panelGroup>
                                    <h:panelGroup rendered="#{ev.status == 'Pending'}"><span class="tag tag-amber">Pending</span></h:panelGroup>
                                    <h:panelGroup rendered="#{ev.status == 'Draft'}"><span class="tag tag-stone">Draft</span></h:panelGroup>
                                    <h:panelGroup rendered="#{ev.status == 'Completed'}"><span class="tag tag-green">Completed</span></h:panelGroup>
                                    <h:panelGroup rendered="#{ev.status == 'Rejected'}"><span class="tag tag-red">Rejected</span></h:panelGroup>
                                    <h:panelGroup rendered="#{ev.status != 'Approved' and ev.status != 'Pending' and ev.status != 'Draft' and ev.status != 'Completed' and ev.status != 'Rejected'}">
                                        <span class="tag tag-stone"><h:outputText value="#{ev.status}"/></span>
                                    </h:panelGroup>
                                </h:panelGroup>
                                <h:panelGroup rendered="#{ev.status == 'Pending'}">
                                    <a href="admin_event_approvals.xhtml" class="btn btn-sage btn-sm">Review →</a>
                                </h:panelGroup>
                            </div>
                        </div>
                    </div>
                </h:column>
            </h:dataTable>
        </div>
    </div>
</div>

<script>
//<![CDATA[
/* sidebar handled by admin_sidebar.xhtml */


function filterEvents(search, status) {
    var cards = document.querySelectorAll('.ev-card');
    var vis = 0;
    var sv = (search||'').toLowerCase();
    var st = (status||'').toLowerCase();
    cards.forEach(function(c){
        var title  = (c.getAttribute('data-title')||'').toLowerCase();
        var cstatus= (c.getAttribute('data-status')||'').toLowerCase();
        var sm = !sv || title.includes(sv);
        var stm= !st || cstatus === st;
        var show = sm && stm;
        c.closest('tr').style.display = show ? '' : 'none';
        if(show) vis++;
    });
    document.getElementById('evCount').textContent = vis + ' event' + (vis!==1?'s':'') + ' shown';
}

window.addEventListener('DOMContentLoaded',function(){
    var cards = document.querySelectorAll('.ev-card');
    document.getElementById('evCount').textContent = cards.length + ' events';
});
//]]>
</script>
</h:body>
</html>
