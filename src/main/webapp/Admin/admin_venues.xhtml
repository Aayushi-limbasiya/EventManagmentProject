<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:pt="jakarta.faces.passthrough"
      lang="en">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Venues — EventMS Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&amp;family=Geist:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
    <style>
    :root{--stone-50:#FAFAF7;--stone-100:#F5F4EF;--stone-200:#EAE8E0;--stone-300:#D6D3C8;--stone-400:#B8B4A4;--stone-500:#8A8675;--stone-600:#605D50;--stone-700:#3D3B31;--stone-800:#1C1A14;--sage:#4A7058;--sage-light:#EBF2ED;--sage-mid:#C2D9CA;--amber:#8B5E1A;--amber-lt:#FAF0DC;--amber-mid:#E8C87A;--green:#3A6B4A;--green-lt:#EAF3EC;--red:#8B2E2E;--red-lt:#F5EAEA;--display:'Cormorant Garamond',Georgia,serif;--body:'Geist',system-ui,sans-serif;--sidebar-w:256px;--radius-sm:6px;--radius:10px;--radius-lg:14px;--shadow-sm:0 1px 3px rgba(15,14,10,0.06);--shadow:0 2px 8px rgba(15,14,10,0.08),0 4px 16px rgba(15,14,10,0.05);--shadow-lg:0 8px 32px rgba(15,14,10,0.10);--transition:0.25s ease;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:var(--body);background:var(--stone-100);color:var(--stone-800);-webkit-font-smoothing:antialiased;font-size:14px;}
    
    .sidebar{position:fixed;inset-block:0;left:0;width:var(--sidebar-w);background:var(--stone-800);display:flex;flex-direction:column;z-index:100;overflow-y:auto;overflow-x:hidden;transition:width var(--transition),transform var(--transition);}
    .sidebar.collapsed{width:0;transform:translateX(-100%);}
    .sb-toggle{position:fixed;top:14px;left:14px;z-index:200;width:34px;height:34px;border-radius:var(--radius-sm);background:var(--stone-800);border:1px solid rgba(255,255,255,0.1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:all 0.15s;}
    .sb-toggle:hover{background:var(--stone-700);}
    .sb-toggle span{display:block;width:16px;height:1.5px;background:rgba(255,255,255,0.7);border-radius:2px;transition:all 0.2s;}
    .sb-toggle.open span:nth-child(1){transform:translateY(5.5px) rotate(45deg);}
    .sb-toggle.open span:nth-child(2){opacity:0;}
    .sb-toggle.open span:nth-child(3){transform:translateY(-5.5px) rotate(-45deg);}
    
    .main{flex:1;min-width:0;padding-left:var(--sidebar-w);display:flex;flex-direction:column;transition:padding-left var(--transition);}
    .main.expanded{padding-left:0;}

    /* Sidebar Content Styles from Dashboard */
    .sidebar-stripe{height:2px;background:linear-gradient(90deg,var(--sage) 0%,var(--amber-mid) 100%);flex-shrink:0;}
    .sb-logo{display:flex;align-items:center;gap:11px;padding:20px 18px 18px 54px;border-bottom:1px solid rgba(255,255,255,0.06);text-decoration:none;white-space:nowrap;}
    .sb-logo-mark{width:32px;height:32px;border-radius:var(--radius-sm);background:var(--sage);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .sb-logo-mark svg{width:16px;height:16px;fill:white;}
    .sb-logo-text{font-family:var(--display);font-size:19px;font-weight:600;color:var(--stone-50);}
    .sb-logo-role{margin-left:auto;font-size:9px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:var(--stone-500);border:1px solid rgba(255,255,255,0.08);padding:2px 7px;border-radius:20px;white-space:nowrap;}
    .sb-identity{margin:12px 14px 6px;padding:11px 13px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:var(--radius);display:flex;align-items:center;gap:10px;white-space:nowrap;}
    .sb-av{width:30px;height:30px;border-radius:50%;background:var(--sage);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:white;flex-shrink:0;}
    .sb-name{font-size:13px;font-weight:500;color:var(--stone-200);}
    .sb-tag{font-size:10px;color:var(--stone-500);margin-top:1px;}
    .sb-section{padding:16px 18px 5px;font-size:9px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--stone-600);white-space:nowrap;}
    .sb-link{display:flex;align-items:center;gap:9px;padding:8px 15px;margin:1px 8px;border-radius:var(--radius-sm);font-size:13px;font-weight:400;color:var(--stone-400);text-decoration:none;cursor:pointer;transition:all 0.14s;position:relative;white-space:nowrap;}
    .sb-link:hover{background:rgba(255,255,255,0.05);color:var(--stone-100);}
    .sb-link.active{background:rgba(74,112,88,0.18);color:var(--stone-50);font-weight:500;}
    .sb-link.active::before{content:'';position:absolute;left:0;top:22%;bottom:22%;width:2px;border-radius:0 2px 2px 0;background:var(--sage);}
    .sb-link svg{width:14px;height:14px;flex-shrink:0;opacity:0.6;}
    .sb-link.active svg,.sb-link:hover svg{opacity:1;}
    .sb-count{margin-left:auto;font-size:10px;font-weight:600;background:var(--amber);color:white;padding:1px 7px;border-radius:20px;}
    .sb-count.g{background:var(--green);}
    .sb-sep{height:1px;background:rgba(255,255,255,0.05);margin:8px 14px;}
    .sb-footer{margin-top:auto;border-top:1px solid rgba(255,255,255,0.05);padding:10px 8px 14px;}
    .sb-foot-link{display:flex;align-items:center;gap:9px;padding:8px 15px;border-radius:var(--radius-sm);font-size:13px;color:var(--stone-500);text-decoration:none;cursor:pointer;transition:all 0.14s;white-space:nowrap;}
    .sb-foot-link:hover{background:rgba(255,255,255,0.04);color:var(--stone-300);}
    .sb-foot-link.out:hover{background:rgba(139,46,46,0.12);color:#D47878;}
    .sb-foot-link svg{width:14px;height:14px;opacity:0.5;}

    .topbar{height:58px;background:var(--stone-50);border-bottom:1px solid var(--stone-200);padding:0 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:var(--shadow-sm);}
    .topbar-title{font-family:var(--display);font-size:20px;font-weight:600;color:var(--stone-800);}
    .content{padding:24px 28px 40px;flex:1;}

    /* List Layout */
    .venues-grid{display:flex; flex-direction:column; gap:14px; width:100%;}
    .venue-card{background:var(--stone-50);border:1px solid var(--stone-200);border-radius:var(--radius-lg);padding:18px 24px;box-shadow:var(--shadow-sm);display:flex; align-items:center; gap:20px; width: 100%;}
    .venue-icon{width:50px;height:50px;border-radius:var(--radius);background:var(--sage-light);display:flex;align-items:center;justify-content:center;font-size:22px;border:1px solid var(--sage-mid);}
    .venue-name{font-family:var(--display);font-size:18px;font-weight:600;color:var(--stone-800);}
    .venue-chip{font-size:11px;color:var(--stone-600);background:var(--stone-100);padding:4px 10px;border-radius:20px;border:1px solid var(--stone-200);display:inline-flex;align-items:center;gap:5px;}
    .venue-actions{margin-left:auto; display:flex; gap:10px;}

    /* Exclusive Form Section */
    .form-card{display:none; background:var(--stone-50); border:1px solid var(--stone-200); border-radius:var(--radius-lg); padding:30px; box-shadow:var(--shadow-lg); width: 100%; max-width: 600px; margin: 40px auto;}
    .fg{margin-bottom:18px;}
    .fl{display:block;font-size:13px;font-weight:600;color:var(--stone-600);margin-bottom:6px;}
    input.fi{width:100%;padding:10px 14px;border:1px solid var(--stone-200);border-radius:var(--radius);font-size:14px;outline:none;background: white;}

    /* Buttons */
    .btn{padding:8px 20px;border-radius:var(--radius-sm);font-size:13px;border:1px solid var(--stone-200);background:white;cursor:pointer; font-weight: 500;}
    .btn-sage{background:var(--sage);color:white;border-color:var(--sage);}
    .btn-red{border-color:#D4A0A0;color:var(--red);background:var(--red-lt);}
    .add-btn{display:flex;align-items:center;gap:7px;padding:10px 20px;background:var(--sage);color:white;border:none;border-radius:var(--radius);font-weight:600;cursor:pointer;}

    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,14,10,0.45);backdrop-filter:blur(3px);z-index:300;align-items:center;justify-content:center;}
    .modal-overlay.open{display:flex;}
    .toast{position:fixed;top:20px;right:20px;z-index:9999;background:var(--stone-50);border-left:3px solid var(--sage);padding:14px 18px;transform:translateX(110%);transition:0.38s ease;box-shadow:var(--shadow-lg); border-radius: 8px;}
    .toast.show{transform:translateX(0);}
    </style>
</h:head>
<h:body>

<ui:include src="admin_sidebar.xhtml">
    <ui:param name="activeMenu" value="venues"/>
</ui:include>

<div class="main" id="mainContent">
    <div class="topbar" id="topbar">
        <div class="topbar-title">Venue Management</div>
    </div>
    
    <div class="content">
        <div class="actions-bar" id="actionsBar" style="display:flex; justify-content: space-between; margin-bottom: 20px;">
            <div class="venue-count" id="venueCount">Loading...</div>
            <button class="add-btn" onclick="openForm('add')">+ Add Venue</button>
        </div>

        <div id="venuesListSection">
            <div class="venues-grid">
                <ui:repeat value="#{adminVenueBean.allVenues}" var="v">
                    <div class="venue-card">
                        <div class="venue-icon">🏛️</div>
                        <div style="flex:1;">
                            <div class="venue-name"><h:outputText value="#{v.name}"/></div>
                            <div style="margin-top:6px;">
                                <span class="venue-chip">👥 <h:outputText value="#{v.capacity}"/> Capacity</span>
                                <h:panelGroup rendered="#{not empty v.location}">
                                    <span class="venue-chip">📍 <h:outputText value="#{v.location}"/></span>
                                </h:panelGroup>
                            </div>
                        </div>
                        <div class="venue-actions">
                            <button type="button" class="btn" onclick="openForm('edit', '#{v.venueId}','#{v.name}','#{v.capacity}','#{v.location}')">✎ Edit</button>
                            <button type="button" class="btn btn-red" onclick="openDeleteModal('#{v.venueId}','#{v.name}')">🗑 Delete</button>
                        </div>
                    </div>
                </ui:repeat>
            </div>
        </div>

        <div class="form-card" id="venueFormSection">
            <div style="display:flex; justify-content:space-between; margin-bottom: 5px;">
                <div style="font-family:var(--display); font-size:22px; font-weight:600;" id="formTitle">Add Venue</div>
                <button type="button" onclick="closeForm()" style="background:none; border:none; cursor:pointer; font-size:24px;">×</button>
            </div>
            <h:form id="venueFormJsf">
                <h:inputHidden id="venueId" value="#{adminVenueBean.selectedVenue.venueId}"/>
                <div class="fg"><label class="fl">Venue Name *</label><h:inputText id="venueName" value="#{adminVenueBean.selectedVenue.name}" styleClass="fi" required="true"/></div>
                <div class="fg"><label class="fl">Capacity *</label><h:inputText id="venueCapacity" value="#{adminVenueBean.selectedVenue.capacity}" styleClass="fi" pt:type="number" required="true"/></div>
                <div class="fg"><label class="fl">Location</label><h:inputText id="venueLocation" value="#{adminVenueBean.selectedVenue.location}" styleClass="fi"/></div>
                <div style="display:flex; gap:12px; margin-top:30px; justify-content: flex-end;">
                    <button type="button" class="btn" onclick="closeForm()">Cancel</button>
                    <h:commandButton value="Save Venue" styleClass="btn btn-sage" action="#{adminVenueBean.saveVenue()}"/>
                </div>
            </h:form>
        </div>
    </div>
</div>

<div class="modal-overlay" id="deleteOverlay">
    <div class="modal">
        <div style="font-family:var(--display); font-size:20px; font-weight:600; margin-bottom:10px;">Delete Venue</div>
        <p style="font-size:13px; color:var(--stone-500); margin-bottom:20px;">Delete <strong id="deleteVenueName"></strong> permanently?</p>
        <h:form id="deleteForm">
            <h:inputHidden id="deleteVenueId" value="#{adminVenueBean.deleteVenueId}"/>
            <div style="display:flex; gap:10px; justify-content:flex-end;">
                <button type="button" class="btn" onclick="closeDeleteModal()">Cancel</button>
                <h:commandButton value="Delete" styleClass="btn btn-red" action="#{adminVenueBean.deleteVenue()}"/>
            </div>
        </h:form>
    </div>
</div>

<div class="toast" id="toast"><div id="tTitle" style="font-weight:600;"></div><div id="tMsg" style="font-size:12px;"></div></div>

<script>
//<![CDATA[
/* sidebar handled by admin_sidebar.xhtml */
function openForm(type, id, name, capacity, location) {
    document.getElementById('venuesListSection').style.display = 'none';
    document.getElementById('actionsBar').style.display = 'none';
    document.getElementById('topbar').style.display = 'none';
    document.getElementById('venueFormSection').style.display = 'block';
    if(type === 'add') {
        document.getElementById('formTitle').textContent = 'Add New Venue';
        document.querySelector('[id$="venueId"]').value = '';
        document.querySelector('[id$="venueName"]').value = '';
        document.querySelector('[id$="venueCapacity"]').value = '';
        document.querySelector('[id$="venueLocation"]').value = '';
    } else {
        document.getElementById('formTitle').textContent = 'Update Venue';
        document.querySelector('[id$="venueId"]').value = id;
        document.querySelector('[id$="venueName"]').value = name;
        document.querySelector('[id$="venueCapacity"]').value = capacity;
        document.querySelector('[id$="venueLocation"]').value = location;
    }
}

function closeForm() {
    document.getElementById('venuesListSection').style.display = 'block';
    document.getElementById('actionsBar').style.display = 'flex';
    document.getElementById('topbar').style.display = 'flex';
    document.getElementById('venueFormSection').style.display = 'none';
}

function openDeleteModal(id, name) {
    document.getElementById('deleteVenueName').textContent = name;
    document.querySelector('[id$="deleteVenueId"]').value = id;
    document.getElementById('deleteOverlay').classList.add('open');
}
function closeDeleteModal() { document.getElementById('deleteOverlay').classList.remove('open'); }

function showToast(title, msg) {
    document.getElementById('tTitle').textContent = title;
    document.getElementById('tMsg').textContent = msg;
    document.getElementById('toast').classList.add('show');
    setTimeout(() => document.getElementById('toast').classList.remove('show'), 3500);
}

window.addEventListener('DOMContentLoaded', () => {
    const count = document.querySelectorAll('.venue-card').length;
    document.getElementById('venueCount').textContent = count + ' registered venues';
    const p = new URLSearchParams(window.location.search);
    if(p.get('saved')==='true') showToast('Success','Venue database updated.');
    if(p.get('deleted')==='true') showToast('Deleted','Venue has been removed.');
});
//]]>
</script>
</h:body>
</html>
