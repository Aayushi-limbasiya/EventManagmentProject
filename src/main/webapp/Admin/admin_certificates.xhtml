<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      lang="en">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Certificates — EventMS Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Geist:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
    <style>
    :root{
        --stone-50:#FAFAF7;--stone-100:#F5F4EF;--stone-200:#EAE8E0;--stone-300:#D6D3C8;
        --stone-400:#B8B4A4;--stone-500:#8A8675;--stone-600:#605D50;--stone-700:#3D3B31;--stone-800:#1C1A14;
        --sage:#4A7058;--sage-light:#EBF2ED;--gold:#C9A227;--gold-lt:#FBF6E3;
        --display:'Cormorant Garamond',Georgia,serif;--body:'Geist',system-ui,sans-serif;
        --sidebar-w:256px;--radius:10px;--radius-lg:14px;
        --shadow-sm:0 1px 3px rgba(15,14,10,.06),0 1px 2px rgba(15,14,10,.04);
        --transition:.25s ease;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:var(--body);background:var(--stone-100);color:var(--stone-800);font-size:14px;-webkit-font-smoothing:antialiased;}
    .main{flex:1;min-width:0;padding-left:var(--sidebar-w);display:flex;flex-direction:column;min-height:100vh;transition:padding-left var(--transition);}
    .topbar{height:58px;background:var(--stone-50);border-bottom:1px solid var(--stone-200);padding:0 24px 0 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:var(--shadow-sm);}
    .topbar-title{font-family:var(--display);font-size:20px;font-weight:600;}
    .topbar-sub{font-size:12px;color:var(--stone-500);margin-top:1px;}
    .content{padding:24px 28px 40px;flex:1;}
    .kpi{background:var(--stone-50);border:1px solid var(--stone-200);border-radius:var(--radius-lg);padding:18px 22px;box-shadow:var(--shadow-sm);display:inline-flex;align-items:center;gap:16px;margin-bottom:22px;}
    .kpi-ic{font-size:24px;}
    .kpi-val{font-family:var(--display);font-size:30px;font-weight:600;line-height:1;}
    .kpi-lbl{font-size:12px;color:var(--stone-500);}
    .card{background:var(--stone-50);border:1px solid var(--stone-200);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden;}
    .card-head{padding:15px 20px;border-bottom:1px solid var(--stone-200);}
    .card-title{font-family:var(--display);font-size:16px;font-weight:600;}
    .card-sub{font-size:11px;color:var(--stone-500);margin-top:2px;}
    .c-row{display:flex;align-items:center;gap:14px;padding:13px 20px;border-bottom:1px solid var(--stone-200);font-size:13px;}
    .c-row:last-child{border-bottom:none;}
    .c-row:hover{background:var(--stone-100);}
    .c-ic{width:38px;height:38px;border-radius:9px;background:var(--gold-lt);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
    .c-name{font-weight:600;}
    .c-ev{font-size:11px;color:var(--stone-500);margin-top:1px;}
    .c-no{font-size:11px;font-family:monospace;color:var(--stone-500);margin-left:auto;margin-right:12px;}
    .c-date{font-size:11px;color:var(--stone-500);margin-right:12px;white-space:nowrap;}
    .btn-sm{padding:7px 13px;border-radius:8px;font-size:12px;font-weight:600;background:var(--sage-light);color:var(--sage);border:1px solid #CBE5D8;cursor:pointer;text-decoration:none;}
    .btn-sm:hover{background:#DEF0E7;}
    .empty{text-align:center;padding:50px;color:var(--stone-400);font-size:13px;}
    </style>
</h:head>
<h:body>

<ui:include src="admin_sidebar.xhtml">
    <ui:param name="activeMenu" value="certificates"/>
</ui:include>

<div class="main" id="mainContent">
    <div class="topbar">
        <div>
            <div class="topbar-title">Certificates</div>
            <div class="topbar-sub">All certificates issued across the platform</div>
        </div>
    </div>

    <div class="content">

        <div class="kpi">
            <div class="kpi-ic">🎓</div>
            <div>
                <div class="kpi-val"><h:outputText value="#{adminCertBean.totalIssued}"/></div>
                <div class="kpi-lbl">Total certificates issued</div>
            </div>
        </div>

        <div class="card">
            <div class="card-head">
                <div class="card-title">Issued Certificates</div>
                <div class="card-sub">Every certificate generated by organizers</div>
            </div>
            <ui:fragment rendered="#{empty adminCertBean.allCertificates}">
                <div class="empty">No certificates issued yet.</div>
            </ui:fragment>
            <ui:repeat value="#{adminCertBean.allCertificates}" var="c">
                <div class="c-row">
                    <div class="c-ic">🏅</div>
                    <div>
                        <div class="c-name"><h:outputText value="#{c.registrationId.userId.name}"/></div>
                        <div class="c-ev"><h:outputText value="#{c.registrationId.eventId.title}"/></div>
                    </div>
                    <div class="c-no"><h:outputText value="#{c.certificateNumber}"/></div>
                    <div class="c-date"><h:outputText value="#{c.issueDate}"><f:convertDateTime pattern="dd MMM yyyy"/></h:outputText></div>
                    <a class="btn-sm" href="#{request.contextPath}/certificate/download?number=#{c.certificateNumber}">⬇ PDF</a>
                </div>
            </ui:repeat>
        </div>

    </div>
</div>
</h:body>
</html>
